name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: System Update and Dependency Install
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git namcap criterion libcap openssl

      - name: Fix Security Permissions for Arch Building
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ./

      - name: Generate and Validate .SRCINFO Consistency
        run: |
          su builder -c "makepkg --printsrcinfo" > .SRCINFO.generated
          if ! diff -u .SRCINFO .SRCINFO.generated; then
            echo "ERROR: Your local .SRCINFO is out of sync with your PKGBUILD!"
            exit 1
          fi

      - name: Test Build Package (Dry Run)
        run: |
          su builder -c "makepkg -s --noconfirm --check"

      - name: Audit Quality via Namcap (Arch Linter)
        run: |
          namcap PKGBUILD

  # AUR deploys are DISABLED while AUR registration is closed (June 2026
  # malware freeze). Keep PKGBUILD/.SRCINFO AUR-ready in-repo; re-enable by
  # setting `if: github.event_name == ...` back and adding AUR_SSH_PRIVATE_KEY,
  # AUR_USERNAME, AUR_EMAIL secrets.
  deploy-to-aur:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Publish to Arch User Repository (AUR)
        uses: KSX4s/github-action-deploy-aur@v3
        with:
          pkgname: wd-passport-kdialog-unlocker
          pkgbuild: ./PKGBUILD
          # Set up your SSH credentials securely inside GitHub repository secrets
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  deploy-to-github-release:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: System Update and Dependency Install
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git criterion
      - name: Fix Security Permissions for Arch Building
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ./

      - name: Build Package
        run: |
          su builder -c "makepkg -s --noconfirm --check --clean"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
            .SRCINFO
            PKGBUILD
